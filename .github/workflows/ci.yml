name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # PR checkouts are a merge commit; depth 2 keeps HEAD^1 (the base) so
          # the freshness gate below can see which files the PR changed.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # backend/static must match the build only when a PR changes frontend
      # source or the packaged bundle itself. Dependency-only changes (Dependabot
      # or manual) shift Vite chunk hashes without source changes; the bundle is
      # regenerated at release time. Gating on changed paths rather than on
      # github.actor keeps main green after a dependency PR is merged, and stops
      # those merges from failing every later PR.
      - name: Detect frontend source changes
        id: frontend-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(frontend/(src|public)/|frontend/index\.html$|frontend/vite\.config\.|frontend/tsconfig|backend/static/)'; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify packaged frontend is current
        if: steps.frontend-changes.outputs.source == 'true'
        run: diff -qr frontend/dist backend/static

  package:
    name: Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/hermes-hudui-wheel
          /tmp/hermes-hudui-wheel/bin/pip install dist/*.whl
          /tmp/hermes-hudui-wheel/bin/hermes-hudui --help
